<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbo Karts</title>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <main id="app">
      <h1 class="logo">TURBO <span>KARTS</span></h1>
      <p class="sub">Phase 2 connectivity check</p>
      <section class="card">
        <div id="qr" aria-label="QR code for the controller"></div>
        <div class="info">
          <label id="netPick" hidden>Network <select id="netSel"></select></label>
          <div class="url" id="url">…</div>
          <div class="warn" id="warn" hidden></div>
          <h2>Phones connected: <b id="count">0</b></h2>
          <ul id="phones"></ul>
        </div>
      </section>
      <p class="foot" id="status">Connecting to server…</p>
    </main>
    <script type="module" src="/host/src/main.ts"></script>
  </body>
</html>
