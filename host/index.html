<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turbo Karts</title>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="huds"></div>
    <!-- D67: scene changes fade through this veil (above the views and HUDs, under the menus) -->
    <div id="veil" class="veil on"></div>
    <div id="debug" class="debug"></div>

    <div id="lobby" class="overlay lobby"></div>

    <div id="pause" class="overlay dim hidden">
      <h2>PAUSED</h2>
      <p class="pauseBy" id="pauseBy"></p>
      <button class="big" id="resumeBtn">RESUME</button>
      <button class="alt" id="quitBtn">Back to lobby</button>
    </div>

    <div id="results" class="overlay hidden">
      <div id="resWrap">
        <div id="resDeco" aria-hidden="true"></div>
        <div id="resTitle">RESULTS</div>
        <ul id="standings"></ul>
        <div id="gpTable" hidden></div>
        <div id="resBest"></div>
        <div class="row">
          <button class="big" id="againBtn">RACE AGAIN</button><button class="alt" id="menuBtn">Back to lobby</button>
        </div>
        <div class="keys">Enter: race again · Esc: lobby · or the leader's phone</div>
      </div>
    </div>

    <div id="introCard" class="introCard"><b></b><span></span><i></i></div>

    <div id="netDown" class="netDown hidden">Connection to the game server lost. Reconnecting…</div>

    <script type="module" src="/host/src/main.ts"></script>
  </body>
</html>
