    <div class="lbl" style="left: 40px; top: 30px">FRONT VIEW</div>
    <div class="lbl" style="left: 680px; top: 30px">BACK VIEW</div>

    <div class="lbl" style="left: 680px; top: 460px">TOP VIEW</div>
